services:
  app:
    build: .
    image: agent-relay:local
    ports:
      - "8000:8000"
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/relay
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    # Localhost only: lets host-side tests reach a separate relay_test database.
    # Both loopbacks, because Windows resolves "localhost" to ::1 first and an
    # IPv4-only binding makes every connection wait ~20s before falling back.
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
