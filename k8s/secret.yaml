# Local development credentials for the kind cluster only (same values as
# compose.yaml).  Use real, generated secrets for any shared deployment.
apiVersion: v1
kind: Secret
metadata:
  name: agent-relay-db
  labels:
    app.kubernetes.io/part-of: agent-relay
type: Opaque
stringData:
  POSTGRES_USER: relay
  POSTGRES_PASSWORD: relay
  POSTGRES_DB: relay
  RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/relay
